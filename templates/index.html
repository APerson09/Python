<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
</head>
<body class="{{ 'darkMode' if session.get('darkMode') else '' }}">
    <h1 class="Title">Reminders</h1>
    <div class="center">
        <div class="center">
            <h2 class="addReminder"> Add Reminder </h2>
            <form action="/" method="POST">
                <input type="text" name="reminder_txt" placeholder="Type Something" class="AddThings">
                <button type="submit" class="AddButton">Add new reminder</button>
            </form> 
        </div>
        <ul>
            {% for reminder in reminders %}
                <li>
                    <span>{{ reminder }}</span>
                    <div class="action-buttons">
                        <a href="/delete/{{ loop.index0 }}" class="action-btn check-btn" style="color:green">Complete</a>
                        <a href="/delete/{{ loop.index0 }}" class="action-btn delete-btn" style="color:red">Delete</a>
                    </div>
                </li>
            {% endfor %}
        </ul>
    </div>
</html>
